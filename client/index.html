<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Health Vault</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f7fb; margin: 0; padding: 0; }
  nav { background: #1976d2; padding: 15px 30px; }
  nav a { color: white; text-decoration: none; margin-right: 25px; font-weight: bold; }
  .container { max-width: 900px; margin: 40px auto; padding: 20px; text-align: center; }
  h1 { color: #1976d2; }
  .btn { display: inline-block; background: #1976d2; color: white; padding: 12px 24px;
         border-radius: 6px; text-decoration: none; margin: 20px 0; }
  .stats { display: flex; justify-content: center; gap: 30px; margin: 30px 0; }
  .stat-box { background: white; padding: 20px 40px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .stat-box h2 { margin: 0; color: #1976d2; font-size: 2em; }
  #status { color: red; font-weight: bold; margin-top: 20px; }
</style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="add.html">Add Record</a>
  <a href="records.html">View Records</a>
</nav>

<div class="container">
  <h1>🩺 Smart Health Vault</h1>
  <p>A simple, secure way to store and manage patient health records.</p>
  <a class="btn" href="add.html">+ Add New Record</a>

  <div class="stats">
    <div class="stat-box">
      <h2 id="totalPatients">0</h2>
      <p>Total Patients</p>
    </div>
    <div class="stat-box">
      <h2 id="uniqueConditions">0</h2>
      <p>Unique Conditions</p>
    </div>
  </div>

  <div id="status"></div>
</div>

<script>
  const API_URL = "https://smart-health-vault-60080678606.catalystserverless.in/server/smart_health_vault_function/";

  async function loadStats() {
    const statusEl = document.getElementById("status");
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error("Server returned " + res.status);
      const data = await res.json();

      document.getElementById("totalPatients").innerText = data.length;

      const uniqueConditions = new Set(data.map(r => r.health_condition)).size;
      document.getElementById("uniqueConditions").innerText = uniqueConditions;

      statusEl.innerText = "";
    } catch (err) {
      console.error("Connection error:", err);
      statusEl.innerText = "Unable to connect to the server.";
    }
  }

  loadStats();
</script>

</body>
</html>
