<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Record - Smart Health Vault</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f7fb; margin: 0; padding: 0; }
  nav { background: #1976d2; padding: 15px 30px; }
  nav a { color: white; text-decoration: none; margin-right: 25px; font-weight: bold; }
  .container { max-width: 500px; margin: 40px auto; padding: 30px; background: white;
               border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  h1 { color: #1976d2; text-align: center; }
  label { display: block; margin-top: 15px; font-weight: bold; }
  input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc;
                     border-radius: 6px; box-sizing: border-box; }
  button { margin-top: 20px; width: 100%; background: #1976d2; color: white; padding: 12px;
           border: none; border-radius: 6px; font-size: 1em; cursor: pointer; }
  button:hover { background: #145ca8; }
  #message { margin-top: 15px; text-align: center; font-weight: bold; }
</style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="add.html">Add Record</a>
  <a href="records.html">View Records</a>
</nav>

<div class="container">
  <h1>Add New Record</h1>
  <form id="recordForm">
    <label>Patient Name</label>
    <input type="text" id="patient_name" required>

    <label>Age</label>
    <input type="number" id="age" required>

    <label>Health Condition</label>
    <input type="text" id="health_condition" required>

    <label>Doctor Name</label>
    <input type="text" id="doctor_name" required>

    <label>Appointment Timing</label>
    <input type="datetime-local" id="appointment_time" required>

    <label>Blood Type</label>
    <select id="blood_type" required>
      <option value="">-- Select --</option>
      <option value="A+">A+</option>
      <option value="A-">A-</option>
      <option value="B+">B+</option>
      <option value="B-">B-</option>
      <option value="AB+">AB+</option>
      <option value="AB-">AB-</option>
      <option value="O+">O+</option>
      <option value="O-">O-</option>
    </select>

    <label>Notes</label>
    <textarea id="notes" rows="4"></textarea>

    <button type="submit">Save Record</button>
  </form>
  <div id="message"></div>
</div>

<script>
  const API_URL = "https://smart-health-vault-60080678606.catalystserverless.in/server/smart_health_vault_function/";

  document.getElementById("recordForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const messageEl = document.getElementById("message");
    messageEl.style.color = "black";
    messageEl.innerText = "Saving...";

    const payload = {
      patient_name: document.getElementById("patient_name").value,
      age: document.getElementById("age").value,
      health_condition: document.getElementById("health_condition").value,
      doctor_name: document.getElementById("doctor_name").value,
      appointment_time: document.getElementById("appointment_time").value,
      blood_type: document.getElementById("blood_type").value,
      notes: document.getElementById("notes").value
    };

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!res.ok) throw new Error("Server returned " + res.status);

      const data = await res.json();
      if (data.success) {
        messageEl.style.color = "green";
        messageEl.innerText = "Record saved successfully!";
        document.getElementById("recordForm").reset();
      } else {
        throw new Error(data.error || "Unknown error");
      }
    } catch (err) {
      console.error("Save error:", err);
      messageEl.style.color = "red";
      messageEl.innerText = "Unable to connect to the server.";
    }
  });
</script>

</body>
</html>
